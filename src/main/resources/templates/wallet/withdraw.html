<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Virement bancaire - FlashCash</title>
    <link rel="stylesheet" th:href="@{/css/logged-header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/withdraw.css}">
</head>
<body>

<div th:replace="~{fragments/logged-header :: logged-header}"></div>

<main class="withdraw-wrapper">
    <div class="withdraw-card">

        <div class="withdraw-header">
            <h1>Virement vers ma banque</h1>
            <p>Les fonds seront transférés vers votre IBAN enregistré.</p>
        </div>

        <div class="withdraw-infos">
            <div class="info-row">
                <span class="info-label">Solde disponible</span>
                <span class="info-value" th:text="${balance / 100} + ' €'">0 €</span>
            </div>
            <div class="info-row">
                <span class="info-label">IBAN destinataire</span>
                <span class="info-value" th:if="${maskedIban != null}" th:text="${maskedIban}">FR76 ****</span>
                <span class="info-value no-iban" th:if="${maskedIban == null}">
                        Aucun IBAN — <a th:href="@{/wallet/iban}">En ajouter un</a>
                </span>
            </div>
        </div>

        <form th:action="@{/wallet/withdraw}" th:object="${withdrawRequestDto}" method="post" class="withdraw-form">

            <div class="input-group">
                <label for="amount">Montant (€)</label>
                <div class="input-wrapper">
                    <span class="currency-symbol">€</span>
                    <input type="number"
                           th:field="*{amount}"
                           id="amount"
                           placeholder="0"
                           min="1"
                           required>
                </div>
            </div>

            <button type="submit" class="withdraw-btn" th:disabled="${maskedIban == null}">
                Virer vers ma banque
            </button>

        </form>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
