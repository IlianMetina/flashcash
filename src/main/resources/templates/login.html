<!DOCTYPE html>
<html lang="fr" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <title>Connexion</title>
        <link rel="stylesheet" th:href="@{/css/auth.css}">
        <link rel="stylesheet" th:href="@{/css/logged-header.css}">
        <link rel="stylesheet" th:href="@{/css/default-header.css}">
        <link rel="stylesheet" th:href="@{css/footer.css}">
    </head>

    <body>

        <div sec:authorize="isAuthenticated()">
            <div th:replace="~{fragments/logged-header :: logged-header}"></div>
        </div>
        <div sec:authorize="isAnonymous()">
            <div th:replace="~{fragments/default-header :: default-header}"></div>
        </div>

        <div class="auth-container">

            <h2>Connexion</h2>

            <form th:action="@{/login}" method="post">

                <div class="form-group">
                    <input type="email" name="username" placeholder="E-mail" required>
                </div>

                <div class="form-group">
                    <input type="password" name="password" placeholder="Mot de passe" required>
                </div>

                <button type="submit">Login</button>

            </form>

            <div class="switch">
                Pas de compte ? <a th:href="@{/register}">S'inscrire</a>
            </div>

        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>


    </body>
</html>
